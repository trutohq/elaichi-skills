name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate the manifest
        run: node scripts/generate-manifest.mjs
      - name: Fail if the generated manifest is stale
        run: git diff --exit-code manifest/skills.json
      - name: Check relative links
        run: node scripts/check-links.mjs
      - name: Validate plugin manifests
        run: node scripts/validate-plugin-manifests.mjs
