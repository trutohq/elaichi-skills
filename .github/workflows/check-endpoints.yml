name: Endpoints vs published spec

# Network-dependent, so it is not part of the pull-request job. Weekly is
# enough: the list only moves when Elaichi ships a route.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-endpoints.mjs
